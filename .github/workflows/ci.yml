name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: install.sh syntax
        run: bash -n install.sh
      - name: pack and install without cargo
        run: |
          cargo build -p raz-cli --release
          bash scripts/pack-release.sh target/release/raz x86_64-unknown-linux-gnu
          PREFIX="$HOME/.local" RAZ_TARBALL=dist/raz-x86_64-unknown-linux-gnu.tar.gz bash install.sh
          "$HOME/.local/bin/raz" report --help
          ./target/release/raz-cli report --help
          ./target/release/raz report --help
