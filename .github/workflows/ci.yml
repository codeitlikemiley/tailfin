name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt (crates we own)
        run: cargo fmt -p tailfin -p tailfin-ledger -p tailfin-proxy -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: install.sh syntax
        run: bash -n install.sh
      - name: pack and install without a second cargo
        run: |
          cargo build -p tailfin --release --locked
          bash scripts/pack-release.sh target/release/tailfin x86_64-unknown-linux-gnu
          PREFIX="$HOME/.local" TAILFIN_TARBALL=dist/tailfin-x86_64-unknown-linux-gnu.tar.gz bash install.sh
          "$HOME/.local/bin/tailfin" report --help
          ./target/release/tailfin report --help
          ./target/release/tailfin doctor testdata/gateway-litellm.yaml
