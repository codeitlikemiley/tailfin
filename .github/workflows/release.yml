name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross from Apple silicon — macos-13 Intel runners queue for a long time.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build -p tailfin --release --locked --target ${{ matrix.target }}
      - name: pack
        run: bash scripts/pack-release.sh "target/${{ matrix.target }}/release/tailfin" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: tailfin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: stage assets
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'tailfin-*.tar.gz' -o -name 'tailfin-*.sha256' \) -exec cp {} dist/ \;
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          cp install.sh dist/install.sh
          ls -la dist
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS
      - name: notes
        run: |
          tag="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          {
            echo "## Install"
            echo
            echo "Prebuilt binary. You do not compile."
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/codeitlikemiley/tailfin/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo "Or pin this tag:"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/codeitlikemiley/tailfin/releases/download/${tag}/install.sh | TAILFIN_VERSION=${tag} bash"
            echo '```'
            echo
            echo "Homebrew:"
            echo
            echo '```sh'
            echo "brew tap codeitlikemiley/tailfin https://github.com/codeitlikemiley/tailfin"
            echo "brew install tailfin"
            echo '```'
            echo
            echo "Checksums are in \`SHA256SUMS\`. macOS arm64/x64 and Linux x64 only — no Windows build."
          } > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            dist/tailfin-aarch64-apple-darwin.tar.gz
            dist/tailfin-aarch64-apple-darwin.tar.gz.sha256
            dist/tailfin-x86_64-apple-darwin.tar.gz
            dist/tailfin-x86_64-apple-darwin.tar.gz.sha256
            dist/tailfin-x86_64-unknown-linux-gnu.tar.gz
            dist/tailfin-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/SHA256SUMS
            dist/install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
