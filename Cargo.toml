[workspace]
resolver = "2"
members = [
  "crates/raz-ident",
  "crates/raz-wire",
  "crates/raz-tree",
  "crates/raz-proxy",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/YOU/raz"

[workspace.dependencies]
serde_json = "1"
