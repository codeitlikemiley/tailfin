[workspace]
resolver = "2"
members = [
  "crates/raz-ident",
  "crates/raz-wire",
  "crates/raz-tree",
  "crates/raz-proxy",
  "crates/raz-ledger",
  "crates/raz-cli",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/goldcoders/raz"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
