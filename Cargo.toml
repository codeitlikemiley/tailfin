[workspace]
resolver = "2"
members = [
  "crates/tailfin-ident",
  "crates/tailfin-wire",
  "crates/tailfin-tree",
  "crates/tailfin-proxy",
  "crates/tailfin-ledger",
  "crates/tailfin",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/codeitlikemiley/tailfin"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
