[package]
name = "tailfin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tailfin run, report, replay, stamp, blame, doctor"

[[bin]]
name = "tailfin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
tailfin-ledger = { path = "../tailfin-ledger" }
tailfin-proxy = { path = "../tailfin-proxy" }
tailfin-wire = { path = "../tailfin-wire" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1"
